<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Helora — Dispatch Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #b28d42; --dark: #1a1a1a; --bg: #f8fafc; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; color: #334155; }
    
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    h2 { margin: 0 0 20px 0; font-weight: 800; color: var(--gold); }
    
    label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin: 15px 0 6px; }
    input, textarea { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 14px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; font-size: 11px; color: #94a3b8; padding: 10px; border-bottom: 2px solid #f1f5f9; }
    .btn-add { background: #f0fdf4; color: #166534; border: 1px dashed #bbf7d0; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 12px; }

    .btn-save { background: var(--dark); color: white; padding: 16px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 25px; }
    .btn-pdf { background: var(--gold); color: white; padding: 20px; border: none; border-radius: 8px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 15px; font-size: 16px; display: none; }

    /* PDF DESIGN FIXES */
    #pdf-slip { 
      width: 140mm; /* Slightly smaller than A5 to ensure no clipping */
      padding: 15mm; 
      background: #ffffff !important; 
      color: #000000 !important;
      display: none; /* Keep hidden normally */
      flex-direction: column;
    }
    .slip-header { border-bottom: 5px solid black; padding-bottom: 15px; margin-bottom: 25px; }
    .slip-name { font-size: 40px; font-weight: 900; text-transform: uppercase; margin: 20px 0; line-height: 1.1; color: #000; }
    .slip-address { font-size: 24px; line-height: 1.4; font-weight: 600; flex-grow: 1; color: #000; }
    .slip-phone { font-size: 38px; font-weight: 900; border: 4px solid black; padding: 15px; text-align: center; margin-bottom: 20px; color: #000; }
    .slip-footer { text-align: center; border-top: 2px dashed black; padding-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>Helora Dispatch</h2>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
          <div><label>Customer Name</label><input id="cName" placeholder="Full Name"></div>
          <div><label>Phone Number</label><input id="cPhone" placeholder="07XXXXXXXX"></div>
      </div>
      <label>Shipping Address</label>
      <textarea id="cAddress" rows="3" placeholder="Full Address"></textarea>

      <label>Products</label>
      <table id="itemTable">
          <thead><tr><th>Item</th><th style="width:70px">Qty</th><th style="width:100px">Price</th></tr></thead>
          <tbody id="itemBody"></tbody>
      </table>
      <button class="btn-add" onclick="addItem()">+ Add Product</button>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:20px">
          <div><label>Discount</label><input type="number" id="discount" value="0" oninput="calculate()"></div>
          <div style="background:#1a1a1a; color:white; padding:15px; border-radius:8px; text-align:center">
              Total: LKR <span id="displayNet" style="color:var(--gold); font-weight:800">0</span>
          </div>
      </div>

      <button id="saveBtn" class="btn-save" onclick="saveData()">1. SAVE TO RECORDS</button>
      <button id="pdfBtn" class="btn-pdf" onclick="generatePDF()">2. DOWNLOAD PARCEL LABEL</button>
    </div>

    <div class="card" style="text-align:center; border: 2px solid #ddd; height: fit-content;">
        <label>Live Preview</label>
        <div style="text-align:left; padding:10px; border-bottom:1px solid #eee; font-size: 12px;">
            <strong>FROM: HELORA</strong><br>Pannipitiya | 077 057 6860
        </div>
        <div id="viewName" style="font-size:22px; font-weight:900; margin:15px 0">---</div>
        <div id="viewAddress" style="font-size:14px; min-height:100px; color:#555">---</div>
        <div id="viewPhone" style="font-size:18px; font-weight:bold; border-top:1px solid #000; padding-top:10px">📞 ---</div>
    </div>
  </div>

  <div id="pdf-wrapper">
    <div id="pdf-slip">
        <div class="slip-header">
            <div style="font-size:30px; font-weight:900">SENDER: HELORA</div>
            <div style="font-size:18px">87/A, Kendahenawaththa Road, Pannipitiya</div>
            <div style="font-size:18px; font-weight:bold">077 057 6860</div>
        </div>
        <div style="font-size:14px; font-weight:900; text-decoration:underline">DELIVER TO:</div>
        <div id="pdfName" class="slip-name">---</div>
        <div id="pdfAddress" class="slip-address">---</div>
        <div id="pdfPhone" class="slip-phone">---</div>
        <div class="slip-footer">
            <div style="font-size:20px; font-weight:800">Helora Beauty Care</div>
            <div style="font-size:14px; margin-top:5px">Pure Natural Beauty • Ayurvedic Care</div>
        </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXdnezXM77NTiNpah637E6jpBP_JUF5T8D6qCVD7Zb1su185yZq3Tec20CXTANBp1YGw/exec";

    function addItem() {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input class="p-n"></td><td><input type="number" class="p-q" value="1" oninput="calculate()"></td><td><input type="number" class="p-p" value="0" oninput="calculate()"></td>`;
        document.getElementById('itemBody').appendChild(tr);
    }
    addItem();

    function calculate() {
        let net = 0;
        document.querySelectorAll('#itemBody tr').forEach(row => {
            const q = parseFloat(row.querySelector('.p-q').value) || 0;
            const p = parseFloat(row.querySelector('.p-p').value) || 0;
            net += (q * p);
        });
        const final = net - (parseFloat(document.getElementById('discount').value) || 0);
        document.getElementById('displayNet').innerText = final.toLocaleString();
        
        const n = document.getElementById('cName').value || "CUSTOMER NAME";
        const a = document.getElementById('cAddress').value || "Address details...";
        const p = document.getElementById('cPhone').value || "07XXXXXXXX";
        
        document.getElementById('viewName').innerText = n; document.getElementById('pdfName').innerText = n;
        document.getElementById('viewAddress').innerText = a; document.getElementById('pdfAddress').innerText = a;
        document.getElementById('viewPhone').innerText = "📞 " + p; document.getElementById('pdfPhone').innerText = "TEL: " + p;
        
        return { final, n, p, a };
    }

    ['cName','cPhone','cAddress'].forEach(id => document.getElementById(id).addEventListener('input', calculate));

    async function saveData() {
        const { final, n, p, a } = calculate();
        if(!n || n === "CUSTOMER NAME") { alert("Please enter Customer Name"); return; }
        
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Saving..."; btn.disabled = true;

        const data = { 
            customerName: n, 
            total: final, 
            itemSummary: `Phone: ${p} | Addr: ${a}` 
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert("Data Saved! You can now download the Label.");
            document.getElementById('pdfBtn').style.display = "block";
            btn.style.display = "none";
        } catch(e) { alert("Error saving data."); btn.disabled = false; }
    }

    async function generatePDF() {
        const element = document.getElementById('pdf-slip');
        
        // IMPORTANT: Show the element temporarily for the PDF engine to see it
        element.style.display = 'flex'; 

        const opt = {
            margin: 0,
            filename: `Helora_${document.getElementById('cName').value}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
            jsPDF: { unit: 'mm', format: 'a5', orientation: 'portrait' }
        };
        
        html2pdf().set(opt).from(element).save().then(() => {
            element.style.display = 'none'; // Hide it again
            alert("Label Downloaded!");
            location.reload();
        });
    }
  </script>
</body>
</html>
